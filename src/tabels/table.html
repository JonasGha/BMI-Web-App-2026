<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI-Tabelle</title>
    <link rel="stylesheet" href="./table.css">
    <script src="./table.js" defer></script>
  </head>
  <body>
    <main>
      <h1>BMI-Tabelle</h1>
      <p id="message">Daten werden geladen …</p>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Größe</th>
            <th>Gewicht</th>
            <th>BMI</th>
            <th>Kategorie</th>
            <th>Datum</th>
          </tr>
        </thead>
        <tbody id="bmi-table-body"></tbody>
      </table>
    </main>
  </body>
</html>
