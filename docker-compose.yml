services:
  frontend:
    image: nginx:alpine
    container_name: bmi-frontend
    restart: always
    ports:
      - "0.0.0.0:8080:80"
    volumes:
      - ./src:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nodered

  nodered:
    image: nodered/node-red:latest
    container_name: bmi-nodered
    restart: always
    ports:
      - "127.0.0.1:1880:1880"
    environment:
      BMI_DB_HOST: db
      BMI_DB_PORT: "5432"
      BMI_DB_NAME: bmi_app
      BMI_DB_USER: bmi_user
      BMI_DB_PASSWORD: bmi_password
    volumes:
      - nodered_data:/data
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: bmi-postgres
    restart: always
    environment:
      POSTGRES_DB: bmi_app
      POSTGRES_USER: bmi_user
      POSTGRES_PASSWORD: bmi_password
    volumes:
      - bmi_postgres_data:/var/lib/postgresql/data

volumes:
  nodered_data:
  bmi_postgres_data:
